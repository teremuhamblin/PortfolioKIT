name: 🐞 Rapport de bug
description: Signaler un problème, un comportement inattendu ou une vulnérabilité
title: "[BUG] Titre clair et concis"
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de remplir ce rapport de bug.
        Fournissez autant de détails que possible pour faciliter l’analyse.

  - type: input
    id: description
    attributes:
      label: Description du problème
      description: Expliquez clairement ce qui ne fonctionne pas.
      placeholder: "Le bug apparaît lorsque..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Décrivez les étapes permettant de reproduire le bug.
      placeholder: |
        1. Aller dans...
        2. Cliquer sur...
        3. Observer...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Décrivez ce que vous pensiez voir.
      placeholder: "Le système aurait dû..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / captures d’écran
      description: Ajoutez des logs, messages d’erreur ou images si nécessaire.
      placeholder: "Erreur: stacktrace..."
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version concernée
      description: Indiquez la version du projet utilisée.
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Système d’exploitation
      options:
        - Linux
        - Windows
        - macOS
        - Android
        - Autre
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Informations supplémentaires
      description: Ajoutez tout détail utile.
